<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="error.title">페이지를 찾을 수 없습니다</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --surface: #ffffff;
        --text: #18202f;
        --muted: #5b6475;
        --primary: #2563eb;
        --border: #d8deea;
        --shadow: 0 24px 60px rgba(37, 99, 235, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Apple SD Gothic Neo", sans-serif;
        background: radial-gradient(circle at top, #ffffff 0%, var(--bg) 55%);
        color: var(--text);
      }

      .page {
        width: min(960px, calc(100% - 32px));
        margin: 0 auto;
        padding: 72px 0;
      }

      .hero {
        padding: 48px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .language-switcher {
        position: relative;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      .language-switcher::after {
        position: absolute;
        top: 50%;
        right: 12px;
        width: 7px;
        height: 7px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        content: "";
        transform: translateY(-75%) rotate(45deg);
        pointer-events: none;
      }

      .language-switcher[hidden] {
        display: none;
      }

      .language-switcher select {
        -webkit-appearance: none;
        appearance: none;
        min-height: 44px;
        padding: 8px 32px 8px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }

      .language-switcher select:focus {
        outline: none;
      }

      .language-switcher select:focus-visible {
        border-color: var(--primary);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--primary);
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3.4rem);
        line-height: 1.15;
      }

      .description {
        margin: 20px 0 0;
        max-width: 640px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 999px;
        background: var(--primary);
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }

      @media (max-width: 640px) {
        .page {
          width: min(100% - 20px, 960px);
          padding: 32px 0;
        }

        .hero {
          padding: 28px 22px;
          border-radius: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <label class="language-switcher" data-language-switcher hidden>
        <span data-i18n="language.label">언어 선택</span>
        <select data-language-select>
          <option value="ko" lang="ko">한국어</option>
          <option value="en" lang="en">English</option>
        </select>
      </label>
      <section class="hero">
        <p class="eyebrow">404</p>
        <h1 data-i18n="error.heading">요청한 페이지를 찾을 수 없습니다.</h1>
        <p class="description" data-i18n="error.description">주소를 다시 확인하거나 홈으로 돌아가 배포 상태를 확인해 주세요.</p>
        <div class="actions">
          <a class="button" id="home-link" href="/" data-i18n="error.home" data-language-home>홈으로 이동</a>
        </div>
      </section>
    </main>
    <script>
      const pathParts = window.location.pathname.split("/").filter(Boolean);
      const isProjectPages =
        window.location.hostname.endsWith("github.io") && pathParts.length > 1;
      const basePath = isProjectPages ? `/${pathParts[0]}/` : "/";

      document.getElementById("home-link")?.setAttribute("href", basePath);

      const languageScript = document.createElement("script");
      languageScript.type = "module";
      languageScript.src = `${basePath}scripts/error-page.js`;
      document.head.appendChild(languageScript);
    </script>
  </body>
</html>
